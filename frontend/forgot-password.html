<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CryptoVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #080b12;
            color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: #111827;
            border: 1px solid #263449;
            border-radius: 16px;
        }

        h1 {
            text-align: center;
        }

        p {
            color: #aab5c5;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            color: white;
            background: #080b12;
            border: 1px solid #34445b;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2878f0;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #263449;
        }

        #message,
        #resetMessage {
            overflow-wrap: anywhere;
        }

        a {
            color: #65a5ff;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
        }

        .hidden {
            display: none;
        }

        .warning {
            color: #fbbf24;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Forgot Password?</h1>
        <p>Enter your registered email to request a password reset.</p>

        <form id="requestForm">
            <label for="email">Registered email</label>
            <input id="email" type="email" autocomplete="email" required>
            <button id="requestButton" type="submit">
                Request Password Reset
            </button>
        </form>

        <p id="message" role="status"></p>

        <section id="resetSection" class="section hidden">
            <h2>Set a New Password</h2>
            <p class="warning">
                Student demo only: the reset token is shown here because email
                delivery has not been configured. Do not deploy this token display
                in a public or production application.
            </p>

            <label for="token">Reset token</label>
            <input id="token" autocomplete="off" required>

            <form id="resetForm">
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>

                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>

                <button id="resetButton" type="submit">
                    Reset Password
                </button>
            </form>

            <p id="resetMessage" role="status"></p>
        </section>

        <p class="footer"><a href="index.html">Back to Sign In</a></p>
    </main>

    <script>
        const requestForm = document.getElementById("requestForm");
        const resetForm = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const resetMessage = document.getElementById("resetMessage");
        const resetSection = document.getElementById("resetSection");
        const requestButton = document.getElementById("requestButton");
        const resetButton = document.getElementById("resetButton");

        const API = "http://127.0.0.1:8000";

        requestForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            resetMessage.textContent = "";
            resetSection.classList.add("hidden");
            requestButton.disabled = true;

            try {
                const response = await fetch(`${API}/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim()
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.detail || "Password reset request failed."
                    );
                }

                message.style.color = "#4ade80";
                message.textContent = result.message ||
                    "If the account exists, follow the recovery instructions.";

                if (result.demo_reset_token) {
                    document.getElementById("token").value =
                        result.demo_reset_token;
                    resetSection.classList.remove("hidden");
                }
            } catch (error) {
                message.style.color = "#f87171";
                message.textContent =
                    error.message === "Failed to fetch"
                        ? "Cannot connect to the backend. Check that FastAPI is running."
                        : error.message;
            } finally {
                requestButton.disabled = false;
            }
        });

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            resetMessage.textContent = "";

            const token = document.getElementById("token").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                resetMessage.style.color = "#f87171";
                resetMessage.textContent = "The passwords do not match.";
                return;
            }

            if (newPassword.length < 8) {
                resetMessage.style.color = "#f87171";
                resetMessage.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            resetButton.disabled = true;

            try {
                const response = await fetch(`${API}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.detail || "Could not reset the password."
                    );
                }

                resetMessage.style.color = "#4ade80";
                resetMessage.textContent =
                    "Password reset successful! You can now sign in with your new password.";

                resetForm.reset();
                document.getElementById("token").value = "";
                resetSection.classList.add("hidden");
            } catch (error) {
                resetMessage.style.color = "#f87171";
                resetMessage.textContent =
                    error.message === "Failed to fetch"
                        ? "Cannot connect to the backend. Check that FastAPI is running."
                        : error.message;
            } finally {
                resetButton.disabled = false;
            }
        });
    </script>
</body>

</html>
